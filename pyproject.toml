[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promouters-backend"
version = "0.1.0"
description = "Backend service for promoter route management and payouts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.4",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "Jinja2==3.1.4",
    "openpyxl==3.1.5",
    "passlib[bcrypt]==1.7.4",
    "PyJWT==2.10.1",
    "psycopg[binary]==3.2.9",
    "pydantic-settings==2.10.1",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "SQLAlchemy==2.0.42",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
