[tool:pytest]
# Директории для поиска тестов
testpaths = tests

# Шаблоны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опции командной строки по умолчанию
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --code-highlight=yes

# Маркеры для категоризации тестов
markers =
    unit: Unit tests (fast tests for individual components)
    integration: Integration tests (tests for component interactions)
    e2e: End-to-end tests (full scenarios)
    slow: Slow tests (take more time)
    api: API tests
    db: Database tests
    smoke: Smoke tests (quick check of main functionality)
    performance: Performance tests

# Фильтр предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
