{% extends "base.html" %}
{% block page_title %}Регистрация пользователя{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Новый пользователь</h1>
  </div>
  <div class="page-actions">
    <a href="/admin/users" class="btn btn-ghost">← К списку</a>
  </div>
</div>

<form method="post" action="/admin/users/register" class="card">
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Имя</label>
      <input type="text" name="first_name" required>
    </div>
    <div class="form-group">
      <label class="form-label">Фамилия</label>
      <input type="text" name="last_name" required>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Телефон</label>
      <input type="tel" name="phone" required placeholder="+7...">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" name="email" required>
    </div>
    <div class="form-group">
      <label class="form-label">Telegram ID (VK ID)</label>
      <input type="number" name="tg_id" placeholder="Обязательно для мастеров">
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input type="password" name="password" required minlength="6">
    </div>
    <div class="form-group">
      <label class="form-label">Роль</label>
      <select name="role_code" required>
        {% for r in roles %}<option value="{{ r.code }}">{{ r.name }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Имя пользователя (username)</label>
      <input type="text" name="username" required>
    </div>
    <div class="form-group">
      <label class="form-label">Филиал</label>
      <select name="branch_id">
        <option value="">—</option>
        {% for b in branches %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn">Создать</button>
    <a href="/admin/users" class="btn btn-ghost">Отмена</a>
  </div>
</form>
{% endblock %}
