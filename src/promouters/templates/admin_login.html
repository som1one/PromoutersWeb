<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход — СУУПР</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/admin/static/css/admin.css">
  <link rel="stylesheet" href="/admin/static/css/login.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo">С</div>
      <div>
        <div class="auth-title">СУУПР</div>
        <div class="auth-subtitle">Единая панель управления</div>
      </div>
    </div>

    {% if flash_error %}<div class="error-message">{{ flash_error }}</div>{% endif %}

    <form method="post" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="phone">Телефон</label>
        <input id="phone" type="tel" name="phone" autocomplete="tel" required
               placeholder="+7..." value="{{ phone or '' }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Пароль</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn" style="width: 100%; justify-content: center;">Войти</button>
      </div>
    </form>

    <div class="auth-footer">
      Войдите с учётной записью оператора, диспетчера или мастера. Доступ к разделам определяется ролью.
    </div>
  </div>
</body>
</html>
