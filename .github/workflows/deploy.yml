name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH (idempotent setup + release)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euxo pipefail

            APP_DIR=/opt/suupr
            SERVICE_NAME=suupr-backend
            REPO_URL=https://github.com/som1one/PromoutersWeb.git
            BRANCH=main
            APP_USER=suupr
            DB_NAME=suupr
            DB_USER=suupr
            DB_PASSWORD=suupr_password

            export DEBIAN_FRONTEND=noninteractive

            echo ">> [bootstrap] Установка системных зависимостей (идемпотентно)"
            apt-get update -y
            # Базовый набор. python3-venv — transitional, поэтому ставим versioned-пакет
            # под фактическую версию python3 (на Ubuntu 24.04 это python3.12-venv).
            PYVER=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
            apt-get install -y --no-install-recommends \
              git curl ca-certificates gnupg \
              nginx \
              python3 python3-venv python3-pip python3-dev "python${PYVER}-venv" \
              build-essential \
              postgresql postgresql-contrib \
              openssl

            echo ">> [bootstrap] Node.js 20.x"
            if ! command -v node >/dev/null 2>&1 || [ "$(node -v | sed 's/v//' | cut -d. -f1)" -lt 18 ]; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            node -v && npm -v

            echo ">> [bootstrap] Системный пользователь $APP_USER"
            id -u "$APP_USER" >/dev/null 2>&1 || useradd -m -s /bin/bash "$APP_USER"
            APP_GROUP=$(id -gn "$APP_USER")

            echo ">> [bootstrap] PostgreSQL: enable + создать БД и пользователя"
            systemctl enable --now postgresql
            sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='$DB_USER'" | grep -q 1 \
              || sudo -u postgres psql -c "CREATE USER $DB_USER WITH PASSWORD '$DB_PASSWORD';"
            sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" | grep -q 1 \
              || sudo -u postgres psql -c "CREATE DATABASE $DB_NAME OWNER $DB_USER;"
            sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE $DB_NAME TO $DB_USER;" >/dev/null

            echo ">> [bootstrap] Директория приложения"
            mkdir -p "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"

            echo ">> [1/7] Sync code в $APP_DIR"
            cd "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -z "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
              else
                git -C "$APP_DIR" init -q
                git -C "$APP_DIR" remote remove origin 2>/dev/null || true
                git -C "$APP_DIR" remote add origin "$REPO_URL"
                git -C "$APP_DIR" fetch origin "$BRANCH"
                git -C "$APP_DIR" checkout -f -B "$BRANCH" "origin/$BRANCH"
              fi
            else
              if git -C "$APP_DIR" remote get-url origin >/dev/null 2>&1; then
                git -C "$APP_DIR" remote set-url origin "$REPO_URL"
              else
                git -C "$APP_DIR" remote add origin "$REPO_URL"
              fi
              git -C "$APP_DIR" fetch origin "$BRANCH"
              git -C "$APP_DIR" reset --hard "origin/$BRANCH"
              git -C "$APP_DIR" clean -fd \
                -e .env \
                -e .venv \
                -e media \
                -e logs \
                -e frontend/.env.local \
                -e frontend/node_modules \
                -e frontend/dist
            fi
            echo "HEAD: $(git -C "$APP_DIR" rev-parse --short HEAD)"

            echo ">> [bootstrap] .env (создаём только если нет)"
            if [ ! -f "$APP_DIR/.env" ]; then
              SECRET_KEY=$(openssl rand -hex 32)
              cat > "$APP_DIR/.env" <<EOF
            POSTGRES_DB=$DB_NAME
            POSTGRES_USER=$DB_USER
            POSTGRES_PASSWORD=$DB_PASSWORD
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DATABASE_URL=postgresql+psycopg://$DB_USER:$DB_PASSWORD@localhost:5432/$DB_NAME
            SECRET_KEY=$SECRET_KEY
            WEB_COOKIE_SECURE=false
            WEB_COOKIE_SAMESITE=lax
            DEBUG=false
            ENVIRONMENT=production
            LOG_LEVEL=INFO
            EOF
              chmod 600 "$APP_DIR/.env"
            fi
            grep -q '^WEB_COOKIE_SECURE=' "$APP_DIR/.env" || echo 'WEB_COOKIE_SECURE=false' >> "$APP_DIR/.env"

            echo ">> [bootstrap] systemd unit $SERVICE_NAME"
            cat > /etc/systemd/system/$SERVICE_NAME.service <<EOF
            [Unit]
            Description=Suupr Backend (FastAPI)
            After=network.target postgresql.service
            Wants=postgresql.service

            [Service]
            Type=simple
            User=$APP_USER
            Group=$APP_GROUP
            WorkingDirectory=$APP_DIR
            Environment=PATH=$APP_DIR/.venv/bin:/usr/local/bin:/usr/bin:/bin
            EnvironmentFile=$APP_DIR/.env
            ExecStart=$APP_DIR/.venv/bin/uvicorn promouters.main:app --host 0.0.0.0 --port 8000
            Restart=always
            RestartSec=5
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable "$SERVICE_NAME"

            echo ">> [bootstrap] systemd unit suupr-telegram-bot"
            cat > /etc/systemd/system/suupr-telegram-bot.service <<EOF
            [Unit]
            Description=Suupr Telegram Bot
            After=network.target postgresql.service
            Wants=postgresql.service

            [Service]
            Type=simple
            User=$APP_USER
            Group=$APP_GROUP
            WorkingDirectory=$APP_DIR/Valeriy/PythonProject2
            Environment=PATH=$APP_DIR/.venv/bin:/usr/local/bin:/usr/bin:/bin
            EnvironmentFile=$APP_DIR/Valeriy/PythonProject2/local.env
            ExecStart=$APP_DIR/.venv/bin/python main.py telegram
            Restart=always
            RestartSec=10
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable suupr-telegram-bot

            echo ">> [bootstrap] systemd unit suupr-vk-bot"
            cat > /etc/systemd/system/suupr-vk-bot.service <<EOF
            [Unit]
            Description=Suupr VK Bot
            After=network.target postgresql.service
            Wants=postgresql.service

            [Service]
            Type=simple
            User=$APP_USER
            Group=$APP_GROUP
            WorkingDirectory=$APP_DIR/Valeriy/PythonProject2
            Environment=PATH=$APP_DIR/.venv/bin:/usr/local/bin:/usr/bin:/bin
            EnvironmentFile=$APP_DIR/Valeriy/PythonProject2/local.env
            ExecStart=$APP_DIR/.venv/bin/python main.py vk
            Restart=always
            RestartSec=10
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable suupr-vk-bot

            echo ">> [2/7] Python venv + deps"
            # Если .venv существует, но битый (нет pip — например ensurepip упал в прошлый раз) — пересоздать.
            if [ -d "$APP_DIR/.venv" ] && ! "$APP_DIR/.venv/bin/python" -m pip --version >/dev/null 2>&1; then
              echo "Битый .venv (нет работающего pip) — удаляем"
              rm -rf "$APP_DIR/.venv"
            fi
            if [ ! -d "$APP_DIR/.venv" ]; then
              python3 -m venv "$APP_DIR/.venv"
            fi
            # Используем python -m pip — работает даже если bin/pip отсутствует
            "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip --quiet
            "$APP_DIR/.venv/bin/python" -m pip install -e "$APP_DIR" --quiet
            # Зависимости Telegram бота
            "$APP_DIR/.venv/bin/python" -m pip install -r "$APP_DIR/Valeriy/PythonProject2/requirements.txt" --quiet

            echo ">> [3/7] Database migrations"
            cd "$APP_DIR"
            "$APP_DIR/.venv/bin/python" -m alembic upgrade head

            echo ">> [3.5/7] Skipped (seed disabled)"

            echo ">> [4/7] Frontend build"
            cd "$APP_DIR/frontend"
            npm install --no-audit --no-fund --prefer-offline
            npm run build

            echo ">> [5/7] Fix ownership for $APP_USER:$APP_GROUP"
            chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"
            chown "$APP_USER:$APP_GROUP" "$APP_DIR/.env"

            echo ">> [6/7] Restart backend"
            systemctl restart "$SERVICE_NAME"
            sleep 3
            systemctl is-active "$SERVICE_NAME"

            echo ">> [6.5/7] Restart Telegram bot"
            if [ -f "$APP_DIR/Valeriy/PythonProject2/local.env" ]; then
              systemctl restart suupr-telegram-bot
              sleep 3
              systemctl is-active suupr-telegram-bot || echo "WARN: telegram bot not active (check local.env)"
            else
              echo "SKIP: Valeriy/PythonProject2/local.env not found — telegram bot not started"
            fi

            echo ">> [6.6/7] Restart VK bot"
            if grep -q 'VK_BOT_TOKEN' "$APP_DIR/Valeriy/PythonProject2/local.env" 2>/dev/null; then
              systemctl restart suupr-vk-bot
              sleep 3
              systemctl is-active suupr-vk-bot || echo "WARN: vk bot not active (check VK_BOT_TOKEN in local.env)"
            else
              echo "SKIP: VK_BOT_TOKEN not found in local.env — VK bot not started"
            fi

            echo ">> [7/7] Reload nginx"
            install -m 644 "$APP_DIR/deploy/nginx-suupr.conf" /etc/nginx/sites-available/suupr
            ln -sf /etc/nginx/sites-available/suupr /etc/nginx/sites-enabled/suupr
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx
            sleep 2

            echo ""
            echo "=========================================="
            echo "  HEALTH CHECKS"
            echo "=========================================="

            FAILED=0
            check() {
              local label="$1" expected="$2" url="$3"
              local code
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
              if [ "$code" = "$expected" ]; then
                echo "  [OK]   $label  $code  $url"
              else
                echo "  [FAIL] $label  got=$code  expected=$expected  $url"
                FAILED=$((FAILED+1))
              fi
            }

            echo ">> Системные сервисы"
            for svc in postgresql nginx "$SERVICE_NAME" suupr-telegram-bot suupr-vk-bot; do
              if systemctl is-active --quiet "$svc"; then
                echo "  [OK]   $svc active"
              else
                echo "  [WARN] $svc not active"
                systemctl status "$svc" --no-pager -l | head -20 || true
                # Bot failures не блокируют деплой
                if [ "$svc" != "suupr-telegram-bot" ] && [ "$svc" != "suupr-vk-bot" ]; then
                  FAILED=$((FAILED+1))
                fi
              fi
            done

            echo ">> Порты слушают"
            for port in 80 8000 5432; do
              if ss -ltn "( sport = :$port )" | grep -q LISTEN; then
                echo "  [OK]   port $port listening"
              else
                echo "  [FAIL] port $port not listening"
                FAILED=$((FAILED+1))
              fi
            done

            echo ">> Подключение к БД"
            DEMO_COUNT=$(sudo -u postgres psql -d "$DB_NAME" -tAc "SELECT COUNT(*) FROM users" 2>/dev/null | tr -d ' ' || echo "?")
            echo "  [info] users в БД: $DEMO_COUNT"

            echo ">> HTTP-эндпоинты через 127.0.0.1 (uvicorn :8000)"
            check "API health"     200 "http://127.0.0.1:8000/api/v1/health"
            check "OpenAPI"        200 "http://127.0.0.1:8000/openapi.json"
            check "Admin login"    200 "http://127.0.0.1:8000/admin/login"

            echo ">> HTTP-эндпоинты через nginx (:80)"
            check "/ (SPA)"        200 "http://127.0.0.1/"
            check "/api/v1/health" 200 "http://127.0.0.1/api/v1/health"
            check "/admin/login"   200 "http://127.0.0.1/admin/login"
            check "/openapi.json"  200 "http://127.0.0.1/openapi.json"

            echo ">> Логин"
            echo "  [info] demo-owner login check skipped (seed disabled)"

            echo ">> Frontend dist собран?"
            if [ -f "$APP_DIR/frontend/dist/index.html" ]; then
              echo "  [OK]   frontend/dist/index.html существует"
            else
              echo "  [FAIL] frontend/dist/index.html отсутствует"
              FAILED=$((FAILED+1))
            fi

            echo ""
            echo "--- last 40 lines of $SERVICE_NAME log ---"
            journalctl -u "$SERVICE_NAME" -n 40 --no-pager || true

            echo ""
            echo "=========================================="
            if [ "$FAILED" -gt 0 ]; then
              echo "  DEPLOY FAILED: $FAILED проверок упало"
              echo "=========================================="
              exit 1
            fi
            echo "  DEPLOY OK — все проверки прошли"
            echo "=========================================="
