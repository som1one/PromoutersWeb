name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euxo pipefail

            APP_DIR=/opt/suupr
            SERVICE_NAME=suupr-backend
            REPO_URL=https://github.com/som1one/PromoutersWeb.git
            BRANCH=main

            # Кто на сервере отвечает за работу backend (для финального chown).
            # Если такого пользователя нет — оставим владельцем root, ничего не сломаем.
            APP_USER=suupr
            id "$APP_USER" >/dev/null 2>&1 || APP_USER=root
            APP_GROUP=$(id -gn "$APP_USER")

            # Git ≥ 2.35 отказывается работать в чужом по владельцу репо.
            # Помечаем рабочую директорию как доверенную глобально для root.
            git config --global --add safe.directory "$APP_DIR"

            echo ">> [1/7] Sync code in $APP_DIR (user=$APP_USER)"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d "$APP_DIR/.git" ]; then
              if [ -z "$(ls -A "$APP_DIR" 2>/dev/null)" ]; then
                echo "Empty dir — fresh clone"
                git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
              else
                echo "Non-empty dir without .git — init in place, preserve .env/.venv/media"
                git -C "$APP_DIR" init -q
                git -C "$APP_DIR" remote remove origin 2>/dev/null || true
                git -C "$APP_DIR" remote add origin "$REPO_URL"
                git -C "$APP_DIR" fetch origin "$BRANCH"
                git -C "$APP_DIR" checkout -f -B "$BRANCH" "origin/$BRANCH"
              fi
            else
              # remote может отсутствовать (репо инициализирован через git init), либо быть с другим URL
              if git -C "$APP_DIR" remote get-url origin >/dev/null 2>&1; then
                git -C "$APP_DIR" remote set-url origin "$REPO_URL"
              else
                git -C "$APP_DIR" remote add origin "$REPO_URL"
              fi
              git -C "$APP_DIR" fetch origin "$BRANCH"
              git -C "$APP_DIR" reset --hard "origin/$BRANCH"
              git -C "$APP_DIR" clean -fd \
                -e .env \
                -e .venv \
                -e media \
                -e logs \
                -e frontend/.env.local \
                -e frontend/node_modules \
                -e frontend/dist
            fi
            echo "HEAD: $(git -C "$APP_DIR" rev-parse --short HEAD)"

            echo ">> [2/7] Python venv + deps"
            if [ ! -d "$APP_DIR/.venv" ]; then
              python3 -m venv "$APP_DIR/.venv"
            fi
            "$APP_DIR/.venv/bin/pip" install --upgrade pip --quiet
            "$APP_DIR/.venv/bin/pip" install -e "$APP_DIR" --quiet

            echo ">> [3/7] Database migrations"
            cd "$APP_DIR"
            "$APP_DIR/.venv/bin/python" -m alembic upgrade head

            echo ">> [4/7] Frontend build"
            cd "$APP_DIR/frontend"
            npm install --no-audit --no-fund --prefer-offline
            npm run build

            echo ">> [5/7] Fix ownership for $APP_USER:$APP_GROUP"
            chown -R "$APP_USER:$APP_GROUP" "$APP_DIR"

            echo ">> [6/7] Restart backend"
            # Гарантируем, что в /opt/suupr/.env присутствует WEB_COOKIE_SECURE=false (для http-доступа без TLS).
            grep -q '^WEB_COOKIE_SECURE=' /opt/suupr/.env || echo 'WEB_COOKIE_SECURE=false' >> /opt/suupr/.env
            chown suupr:suupr /opt/suupr/.env
            systemctl restart "$SERVICE_NAME"
            sleep 2
            systemctl is-active "$SERVICE_NAME"

            echo ">> [7/7] Reload nginx and smoke check"
            # Гарантируем, что nginx проксирует /admin/* в uvicorn (а не отдаёт SPA index.html).
            install -m 644 "$APP_DIR/deploy/nginx-suupr.conf" /etc/nginx/sites-available/suupr
            ln -sf /etc/nginx/sites-available/suupr /etc/nginx/sites-enabled/suupr
            rm -f /etc/nginx/sites-enabled/default
            nginx -t
            systemctl reload nginx
            sleep 1
            curl -fsS -o /dev/null -w 'HEALTH=%{http_code}\n' http://127.0.0.1/api/v1/health
            curl -fsS -o /dev/null -w 'INDEX=%{http_code}\n'  http://127.0.0.1/
            # Проверяем что /admin/login отдаёт серверный Jinja, а не SPA
            ADMIN_HTML=$(curl -sS http://127.0.0.1/admin/login | head -c 200)
            echo "ADMIN_HEAD: $ADMIN_HTML"

            echo ">> [diag] End-to-end smoke ring across roles"
            COOKIE_JAR=$(mktemp)

            # Owner login + базовые страницы
            curl -sS -i -c "$COOKIE_JAR" \
              -d "phone=%2B79990000001&password=demo12345&next=" \
              http://127.0.0.1/admin/login | head -10
            echo "--- cookies ---"; cat "$COOKIE_JAR" | grep -v '^#' || true

            # Базовые страницы под owner
            for path in /admin/ /admin/stats /admin/users /admin/promoters /admin/routes /admin/payouts /admin/expense-plans /admin/master-requests /admin/notifications /admin/audit /admin/cash; do
              CODE=$(curl -sS -b "$COOKIE_JAR" -o /tmp/owner_$(echo "$path" | tr '/' '_').html -w '%{http_code}' "http://127.0.0.1$path")
              echo "owner GET $path -> $CODE"
            done

            # Branch manager
            BJAR=$(mktemp)
            curl -sS -i -c "$BJAR" \
              -d "phone=%2B79990000002&password=demo12345&next=" \
              http://127.0.0.1/admin/login | head -3
            for path in /admin/ /admin/stats /admin/promoters /admin/routes /admin/payouts /admin/expense-plans /admin/master-requests; do
              CODE=$(curl -sS -b "$BJAR" -o /dev/null -w '%{http_code}' "http://127.0.0.1$path")
              echo "branch_manager GET $path -> $CODE"
            done

            # Master
            MJAR=$(mktemp)
            curl -sS -i -c "$MJAR" \
              -d "phone=%2B79990000007&password=demo12345&next=" \
              http://127.0.0.1/admin/login | head -3
            for path in /admin/ /admin/master-requests; do
              CODE=$(curl -sS -b "$MJAR" -o /dev/null -w '%{http_code}' "http://127.0.0.1$path")
              echo "master GET $path -> $CODE"
            done

            # Dispatcher
            DJAR=$(mktemp)
            curl -sS -i -c "$DJAR" \
              -d "phone=%2B79990000008&password=demo12345&next=" \
              http://127.0.0.1/admin/login | head -3
            for path in /admin/ /admin/master-requests /admin/orders; do
              CODE=$(curl -sS -b "$DJAR" -o /dev/null -w '%{http_code}' "http://127.0.0.1$path")
              echo "dispatcher GET $path -> $CODE"
            done

            echo "--- last 80 lines of suupr-backend log ---"
            journalctl -u suupr-backend -n 80 --no-pager || tail -80 /var/log/suupr-backend.err.log || true

            rm -f "$COOKIE_JAR" "$BJAR" "$MJAR" "$DJAR" /tmp/owner_*.html

            echo "=== DEPLOY OK ==="
