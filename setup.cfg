[metadata]
name = promouters
version = 1.0.0
description = Пример проекта с полным тестовым покрытием
author = Developer

[options]
packages = find:
python_requires = >=3.8

[options.packages.find]
where = .
exclude = tests*

[coverage:run]
source = promouters
branch = True
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if typing.TYPE_CHECKING:
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist
ignore = E203, W503
